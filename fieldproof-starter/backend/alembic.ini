# Alembic configuration for the FieldProof API.
#
# The database URL is NOT stored here: it is taken from the application settings
# (DATABASE_URL) inside ``migrations/env.py`` so credentials never live in
# a tracked file.
#
# Usage (from the ``fieldproof-starter`` directory):
#   python -m alembic -c backend/alembic.ini upgrade head
#   python -m alembic -c backend/alembic.ini downgrade -1
#   python -m alembic -c backend/alembic.ini revision --autogenerate -m "describe change"
#   python -m alembic -c backend/alembic.ini check        # CI: migrations match models

[alembic]
# ``%(here)s`` is this file's directory, so the location resolves correctly
# whether we run from the repo checkout (fieldproof-starter/) or inside the
# runtime image (/app).
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# Timestamped, ordered revision filenames keep history readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
propagate = 0

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
