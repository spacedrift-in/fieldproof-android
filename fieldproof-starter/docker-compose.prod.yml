# Production-style stack: Postgres + MinIO (S3-compatible object storage) +
# ClamAV + the API container running as non-root.
#
#   cp .env.example .env   # then edit it
#   docker compose -f docker-compose.prod.yml up -d --build
#   curl -fsS http://localhost:8000/readyz
#
# This file is a reference baseline, not a hardened managed-platform setup. See
# docs/deployment.md for secrets, TLS, scaling and backups; and
# docs/disaster-recovery.md for restore runbooks.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fieldproof}
    volumes:
      - fieldproof-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fieldproof}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - fieldproof-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # Creates the private evidence bucket once MinIO is up. The API also applies
  # a public-access block and lifecycle policy at startup.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$${EVIDENCE_S3_BUCKET:-fieldproof-evidence} &&
      mc anonymous set none local/$${EVIDENCE_S3_BUCKET:-fieldproof-evidence}
      "
    restart: "no"

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging: *default-logging

  api:
    build:
      context: ./backend
    image: fieldproof-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      # The root filesystem is read-only; point HOME at the tmpfs so any
      # incidental cache writes succeed.
      HOME: /tmp
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fieldproof}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fieldproof}
      EVIDENCE_STORAGE_BACKEND: s3
      EVIDENCE_S3_ENDPOINT_URL: http://minio:9000
      EVIDENCE_S3_USE_SSL: "false"
      EVIDENCE_S3_BUCKET: ${EVIDENCE_S3_BUCKET:-fieldproof-evidence}
      # For this stack boto3 uses the MinIO credentials; use a dedicated
      # service account in real deployments.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MALWARE_SCANNER: clamav
      CLAMAV_HOST: clamav
      RATE_LIMIT_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

volumes:
  fieldproof-pgdata:
  fieldproof-minio:
