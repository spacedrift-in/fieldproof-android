services:
  db:
    image: postgres:16-alpine
    container_name: fieldproof-postgres
    environment:
      POSTGRES_USER: fieldproof
      POSTGRES_PASSWORD: fieldproof
      POSTGRES_DB: fieldproof
    ports:
      - "5432:5432"
    volumes:
      - fieldproof-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fieldproof-pgdata:
